<svg xmlns="http://www.w3.org/2000/svg" width="900" height="600" viewBox="0 0 900 600">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1B2E47"/>
      <stop offset="1" stop-color="#0C1929"/>
    </linearGradient>
    <pattern id="grid" width="45" height="45" patternUnits="userSpaceOnUse">
      <path d="M 45 0 L 0 0 0 45" fill="none" stroke="#2C425F" stroke-width="1" opacity="0.5"/>
    </pattern>
  </defs>
  <rect width="900" height="600" fill="url(#bg)"/>
  <rect width="900" height="600" fill="url(#grid)"/>
  <!-- factory building schematic -->
  <g transform="translate(450,260)" stroke="#5E8EC4" stroke-width="5" fill="none" stroke-linejoin="round">
    <path d="M-180,120 L-180,-40 L-60,-40 L-60,-100 L60,-100 L60,-40 L180,-40 L180,120 Z"/>
    <path d="M-90,-40 L-90,-60 L-30,-60 L-30,-40" stroke-width="4"/>
    <path d="M30,-40 L30,-60 L90,-60 L90,-40" stroke-width="4"/>
    <path d="M-140,20 L-60,20 M-140,60 L-60,60 M60,20 L140,20 M60,60 L140,60" stroke-width="4"/>
    <path d="M-20,120 L-20,80 L20,80 L20,120" stroke-width="4"/>
    <path d="M-180,120 L180,120" stroke-width="6"/>
  </g>
  <rect x="350" y="420" width="200" height="3" rx="1.5" fill="#2C425F"/>
  <text x="450" y="470" text-anchor="middle" font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="30" fill="#DCE6F2" font-weight="600">此处替换为真实厂房/设备图</text>
  <text x="450" y="512" text-anchor="middle" font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="18" fill="#7C91AB">建议 900×600 · 车间 / 产线 / 检测设备</text>
</svg>
