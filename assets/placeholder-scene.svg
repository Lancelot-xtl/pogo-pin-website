<svg xmlns="http://www.w3.org/2000/svg" width="800" height="540" viewBox="0 0 800 540">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1C3350"/>
      <stop offset="1" stop-color="#0D1D33"/>
    </linearGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#2E4A6E" stroke-width="1" opacity="0.5"/>
    </pattern>
  </defs>
  <rect width="800" height="540" fill="url(#bg)"/>
  <rect width="800" height="540" fill="url(#grid)"/>
  <!-- device schematic -->
  <g transform="translate(400,210)" stroke="#5E8EC4" stroke-width="4" fill="none">
    <rect x="-120" y="-80" width="240" height="160" rx="18" stroke-width="5"/>
    <path d="M-70,-8 L-70,8 M70,-8 L70,8 M-8,-50 L8,-50 M-8,50 L8,50" stroke-width="4"/>
    <circle cx="0" cy="0" r="26" stroke-width="4" fill="none"/>
    <path d="M-18,-18 L18,18 M-18,18 L18,-18" stroke-width="4" opacity="0.7"/>
  </g>
  <rect x="300" y="330" width="200" height="3" rx="1.5" fill="#2E4A6E"/>
  <text x="400" y="380" text-anchor="middle" font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="30" fill="#DCE6F2" font-weight="600">此处替换为真实应用场景图</text>
  <text x="400" y="420" text-anchor="middle" font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="18" fill="#7C91AB">建议 800×540 · 实拍应用环境</text>
</svg>
